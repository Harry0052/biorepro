name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python package
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Install rootless Podman
        run: sudo apt-get update && sudo apt-get install -y podman

      - name: Build the worker image
        run: scripts/build_worker.sh

      - name: Compile and test
        run: |
          .venv/bin/python -m compileall -q biorepro tests
          .venv/bin/pytest -q

      - name: Run the fixture demo
        run: .venv/bin/biorepro demo --output outputs/demo

      - name: Upload demo evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demo-evidence
          path: |
            outputs/demo/demo.json
            outputs/demo/demo.md
            outputs/demo/clean/evidence.json
            outputs/demo/clean/evidence.md
            outputs/demo/clean/endpoints.csv
            outputs/demo/perturbed-comparison.json
            outputs/demo/perturbed-comparison.md
            outputs/demo/invalid/evidence.json
          if-no-files-found: error
